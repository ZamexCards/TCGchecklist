
name: Update Pokemon checklist data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

concurrency:
  group: pokemon-checklist-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh set and card snapshots
        run: python scripts/update_data.py

      - name: Bulk archive card images and set logos from verified sources
        env:
          IMAGE_REPAIR_LIMIT: '200'
        run: python scripts/archive_images.py

      - name: Audit all card images and set logos
        run: python scripts/audit_images.py

      - name: Diagnose remaining missing image sources
        run: python scripts/diagnose_images.py

      - name: Publish clear progress summary
        if: always()
        run: |
          if [ -f data/image_audit.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          t=json.loads(Path('data/image_audit.json').read_text())['totals']
          print('## ZamexCards checklist – werkelijke afbeeldingsstatus')
          print(f"**Volledige sets:** {t['complete_sets']} / {t['sets']}")
          print(f"**Kaartafbeeldingen lokaal:** {t['local_cards']} / {t['cards']}")
          print(f"**Ontbrekende kaartafbeeldingen:** {t['missing_cards']}")
          print(f"**Externe kaartlinks, niet geverifieerd:** {t['external_cards']}")
          print(f"**Setlogo's lokaal:** {t['local_logos']} / {t['sets']}")
          print(f"**Ontbrekende setlogo's:** {t['missing_logos']}")
          print()
          print('Een groene workflow betekent dat de update is uitgevoerd, niet dat alle afbeeldingen gevonden zijn.')
          PY
          fi

      - name: Commit changed JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ assets/
          if ! git diff --cached --quiet; then
            git commit -m "Update Pokémon checklist data"
            git push
          fi
