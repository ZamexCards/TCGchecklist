
name: Update Pokemon checklist data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

concurrency:
  group: pokemon-checklist-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh set and card snapshots
        run: python scripts/update_data.py

      - name: Archive and audit card images and set logos
        run: python scripts/archive_images.py

      - name: Audit all card images and set logos
        run: python scripts/audit_images.py

      - name: Commit changed JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ assets/
          if ! git diff --cached --quiet; then
            git commit -m "Update Pokémon checklist data"
            git push
          fi
