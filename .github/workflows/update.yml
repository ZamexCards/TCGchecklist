name: Update Pokemon checklist data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'scripts/update_data.py'
      - 'scripts/archive_available_images.py'
      - 'scripts/audit_images.py'
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pokemon-checklist-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validation
        run: python -m pip install pillow
      - name: Refresh new sets, promos and missing artwork
        run: python scripts/update_data.py
      - name: Store available card images and logos
        run: python scripts/archive_available_images.py
      - name: Audit images
        run: python scripts/audit_images.py
      - name: Publish progress summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          t=json.loads(Path('data/image_audit.json').read_text())['totals']
          print('## ZamexCards — wekelijkse update')
          print(f"Sets compleet: {t['complete_sets']} / {t['sets']}")
          print(f"Afbeeldingen opgeslagen: {t['local_cards']} / {t['cards']}")
          print(f"Nog zonder afbeelding: {t['missing_cards']}")
          print(f"Nog te downloaden: {t['external_cards']}")
          print('Onbeschikbare afbeeldingen worden bij de volgende maandagupdate opnieuw geprobeerd.')
          PY
      - name: Commit and preserve concurrent changes
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ assets/
          echo 'changed=false' >> "$GITHUB_OUTPUT"
          if ! git diff --cached --quiet; then
            git commit -m 'Weekly Pokemon checklist update'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo '::error::Concurrent changes conflict; refusing to overwrite them.'
                exit 1
              fi
              if git push origin HEAD:main; then
                echo 'changed=true' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
            exit 1
          fi
      - name: Package updated site
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
  deploy:
    if: needs.update.outputs.changed == 'true'
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish updated checklist
        id: deployment
        uses: actions/deploy-pages@v4
